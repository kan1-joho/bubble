<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バブルソート可視化（i と j の連動）</title>
<style>
body{font-family:"Hiragino Sans","Meiryo",sans-serif;margin:0;padding:16px;background:#f5f7fa;color:#222;text-align:center}
#title{font-size:clamp(20px,3.4vw,32px);font-weight:bold;margin:8px 0}
#msg{font-size:clamp(15px,2.2vw,22px);min-height:1.6em;margin-bottom:8px;color:#444}
#stage{position:relative;width:480px;height:400px;margin:20px auto 0}
.bar{position:absolute;bottom:56px;width:70px;border-radius:6px 6px 0 0;color:#fff;font-weight:bold;font-size:22px;
 text-align:center;padding-top:4px;box-sizing:border-box;
 transition:left .9s ease-in-out, background .3s}
.bar.moving{z-index:5;box-shadow:0 6px 12px rgba(0,0,0,.35)}
.blue{background:#3b82f6}.yellow{background:#facc15;color:#222}.red{background:#ef4444}.green{background:#22c55e}
.idx,.ptr{position:absolute;width:70px;text-align:center}
.idx{bottom:30px;font-size:14px;color:#666}
.ptr{bottom:4px;font-weight:bold;font-size:18px;color:#b45309}
#wall{position:absolute;bottom:56px;height:320px;border-left:3px dashed #7c3aed;transition:left .5s}
#wall span{position:absolute;top:-26px;left:-40px;width:80px;color:#7c3aed;font-weight:bold;font-size:18px}
button{font-size:18px;padding:8px 18px;margin:4px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
button:hover{background:#1d4ed8}
.legend span{display:inline-block;margin:6px 10px;font-size:15px}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:4px;border-radius:3px}
</style>
</head>
<body>
<div id="title"></div>
<div id="msg"></div>
<div id="stage"></div>
<div class="legend">
 <span><i class="blue"></i>未確定</span><span><i class="yellow"></i>比較中(j, j+1)</span>
 <span><i class="red"></i>交換</span><span><i class="green"></i>確定</span>
</div>
<div id="ctl">
 <button id="play">▶ 再生</button><button id="prev">◀ 戻る</button><button id="next">次へ ▶</button><button id="reset">最初から</button>
 <div style="margin-top:6px">1コマ：<input type="range" id="spd" min="1200" max="3000" step="100" value="1800"> <span id="spdv">1.8</span>秒</div>
</div>

<script>
// ---------- ① 全ステップを先に作る（棒には「id」を付けて追跡する） ----------
const init = [93, 15, 76, 8, 34, 17];
const n = init.length, PITCH = 80;
let order = init.map((v, id) => id);        // order[位置] = 棒のid
const frames = [];
function add(type, i, j, text) { frames.push({order: order.slice(), type, i, j, text}); }

add("start", n, null, "スタート：これから i = 6 の周回を始めます");
for (let i = n; i >= 2; i--) {
  for (let j = 0; j <= i - 2; j++) {
    const L = init[order[j]], R = init[order[j + 1]];
    add("compare", i, j, `a[${j}]=${L} と a[${j+1}]=${R} を比べる`);
    if (L > R) {
      [order[j], order[j + 1]] = [order[j + 1], order[j]];
      add("swap", i, j, `${L} > ${R} なので交換！（棒が入れ替わる）`);
    }
  }
  add("confirm", i, null, `i = ${i} の周回おわり → a[${i-1}]=${init[order[i-1]]} が確定（緑）。次は i = ${i-1}`);
}
add("done", 1, null, "全部そろいました！");

function greenFrom(f) {
  if (f.type === "done") return 0;
  if (f.type === "confirm") return f.i - 1;
  return f.i;
}

// ---------- ② 部品を一度だけ作る（動かすのは位置だけ） ----------
const stage = document.getElementById("stage");
const maxV = Math.max(...init);
const bars = init.map((v, id) => {
  const d = document.createElement("div");
  d.className = "bar blue";
  d.style.height = (Math.round(v / maxV * 230) + 20) + "px";
  d.textContent = v;
  stage.appendChild(d);
  return d;
});
const ptrs = [];
for (let k = 0; k < n; k++) {
  const idx = document.createElement("div");
  idx.className = "idx"; idx.textContent = `[${k}]`; idx.style.left = (k * PITCH) + "px";
  stage.appendChild(idx);
  const p = document.createElement("div");
  p.className = "ptr"; p.style.left = (k * PITCH) + "px";
  stage.appendChild(p); ptrs.push(p);
}
const wall = document.createElement("div");
wall.id = "wall"; stage.appendChild(wall);

// ---------- ③ 1コマ描画 ----------
function draw(f) {
  const gf = greenFrom(f);
  const t = document.getElementById("title");
  if (f.type === "done") t.textContent = "ソート完了！（i = 1）";
  else if (f.type === "confirm") t.textContent = `外側ループ i = ${f.i} 終了 / 内側 j = －`;
  else t.textContent = `外側ループ i = ${f.i}（残り${f.i}個をチェック中） / 内側 j = ${f.j === null ? "－" : f.j}`;
  document.getElementById("msg").textContent = f.text;

  f.order.forEach((id, pos) => {
    const b = bars[id];
    b.style.left = (pos * PITCH) + "px";           // ← ここが動く（transitionで滑る）
    let c = "blue";
    if (f.type === "done" || pos >= gf) c = "green";
    else if ((f.type === "compare" || f.type === "swap") && (pos === f.j || pos === f.j + 1))
      c = f.type === "swap" ? "red" : "yellow";
    b.className = "bar " + c + (c === "red" ? " moving" : "");
  });
  const active = (f.type === "compare" || f.type === "swap");
  ptrs.forEach((p, k) => p.textContent = active ? (k === f.j ? "j" : k === f.j + 1 ? "j+1" : "") : "");

  // 壁 i：確定領域との境目
  const wallPos = f.type === "done" ? null : (f.type === "confirm" ? f.i - 1 : f.i);
  if (wallPos === null || wallPos < 1) wall.style.display = "none";
  else {
    wall.style.display = "block";
    wall.style.left = (wallPos * PITCH - 5) + "px";
    wall.innerHTML = `<span>壁 i=${f.type === "confirm" ? f.i - 1 : f.i}</span>`;
  }
}

// ---------- ④ 再生コントロール ----------
let pos = 0, timer = null;
const spd = document.getElementById("spd"), playBtn = document.getElementById("play");
function show() { draw(frames[pos]); }
function step() { if (pos < frames.length - 1) { pos++; show(); } else stop(); }
function stop() { clearInterval(timer); timer = null; playBtn.textContent = "▶ 再生"; }
function start() {
  if (pos >= frames.length - 1) pos = 0;
  playBtn.textContent = "⏸ 一時停止";
  show();
  timer = setInterval(step, Number(spd.value));
}
playBtn.onclick = () => timer ? stop() : start();
document.getElementById("next").onclick = () => { stop(); step(); };
document.getElementById("prev").onclick = () => { stop(); if (pos > 0) pos--; show(); };
document.getElementById("reset").onclick = () => { stop(); pos = 0; show(); };
spd.oninput = () => {
  document.getElementById("spdv").textContent = (spd.value / 1000).toFixed(1);
  if (timer) { clearInterval(timer); timer = setInterval(step, Number(spd.value)); }
};
show();
</script>
</body>
</html>
